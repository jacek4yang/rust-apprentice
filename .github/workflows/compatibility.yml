name: Optional latest Skills compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes skills@latest add . --list
