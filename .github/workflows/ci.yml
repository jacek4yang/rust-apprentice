name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux only: macOS shares the POSIX paths exercised on Linux, and
        # runner minutes are better spent elsewhere.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repository checks
        run: node tests/repo-checks.mjs
        shell: bash

      - name: Validate SKILL.md against the Agent Skills specification
        run: node tests/validate-skills.mjs
        shell: bash

      - name: Assert the Skills CLI discovers exactly three skills
        run: node tests/assert-discovery.mjs
        shell: bash
